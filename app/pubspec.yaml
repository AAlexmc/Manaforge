name: manaforge_app
description: ManaForge — colección visual y generador de mazos de Magia, multiplataforma.
publish_to: 'none'
version: 0.3.0+3

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  forge_engine:
    path: ../forge_engine
  camera: ^0.11.0
  camera_windows: ^0.2.6
  desktop_drop: ^0.4.4
  file_selector: ^1.0.3
  http: ^1.2.0
  image: ^4.2.0
  path: ^1.9.0
  path_provider: ^2.1.3
  sqlite3: ^2.4.0
  sqlite3_flutter_libs: ^0.5.24
  url_launcher: ^6.3.2
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  fonts:
    # Cinzel: capitales romanas, la letra de los certificados. Va dentro de la
    # app (no se descarga) para que el papel salga igual sin conexión y en
    # cualquier plataforma. Fuente variable: los pesos se piden con
    # `fontVariations: [FontVariation('wght', N)]`.
    # Licencia SIL Open Font 1.1 — assets/fonts/Cinzel-OFL.txt
    - family: Cinzel
      fonts:
        - asset: assets/fonts/Cinzel-Variable.ttf

# Icono de la app para Windows y macOS. Linux no mete el icono en el binario:
# ahí van el .desktop y los PNG de linux/packaging/ (ver instalar.sh).
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/icon/app_icon.png"
