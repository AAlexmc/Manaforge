name: Build card database
on:
  workflow_dispatch:        # lanzable a mano desde la pestaña Actions
  schedule:
    - cron: '0 5 * * *'     # y cada día a las 05:00 UTC (precios frescos)
  push:
    tags: ['build-db-*']    # o empujando un tag build-db-N
permissions:
  contents: write           # para publicar la release
jobs:
  build-db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install ijson
      - name: Descargar bulk Default Cards de Scryfall
        run: |
          set -euo pipefail
          curl -sf \
            -H "User-Agent: ManaForge-CI/1.0 (github.com/AAlexmc/Manaforge)" \
            -H "Accept: application/json" \
            https://api.scryfall.com/bulk-data/default-cards -o bulkmeta.json \
            || { echo "Fallo consultando bulk-data:"; cat bulkmeta.json || true; exit 1; }
          head -c 400 bulkmeta.json; echo
          URI=$(python3 -c "import json;print(json.load(open('bulkmeta.json'))['download_uri'])")
          DATE=$(python3 -c "import json;print(json.load(open('bulkmeta.json'))['updated_at'][:10])")
          echo "BULK_DATE=$DATE" >> "$GITHUB_ENV"
          # "--" separa opciones de la URL: una URI que empezara por "-" no se
          # puede interpretar como opción de curl
          curl -sfL --retry 3 --compressed -H "User-Agent: ManaForge-CI/1.0" -H "Accept: */*" -o bulk.json -- "$URI"
          ls -lh bulk.json
      - name: Construir SQLite
        run: |
          set -euo pipefail
          echo "Diagnóstico del bulk:"; ls -lh bulk.json; head -c 200 bulk.json; echo
          python3 scripts/build_card_db.py bulk.json manaforge_cards.sqlite "$BULK_DATE"
      - name: Nombres en español (bulk All Cards, en streaming)
        run: |
          set -euo pipefail
          # All Cards (~2,9 GB) es el único bulk con todas las lenguas. Se
          # streamea de curl a python sin tocar el disco del runner: el
          # script pone cards.name_es (schema v5) para ~83% de las cartas.
          curl -sf \
            -H "User-Agent: ManaForge-CI/1.0 (github.com/AAlexmc/Manaforge)" \
            -H "Accept: application/json" \
            https://api.scryfall.com/bulk-data/all-cards -o allmeta.json \
            || { echo "Fallo consultando bulk-data:"; cat allmeta.json || true; exit 1; }
          URI=$(python3 -c "import json;print(json.load(open('allmeta.json'))['download_uri'])")
          curl -sfL --retry 3 --compressed -H "User-Agent: ManaForge-CI/1.0" -H "Accept: */*" -- "$URI" \
            | python3 scripts/enrich_names_es.py manaforge_cards.sqlite
      - name: Comprimir
        run: |
          set -euo pipefail
          gzip -9 manaforge_cards.sqlite
          ls -lh manaforge_cards.sqlite.gz
      - name: Publicar como release card-db-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete card-db-latest --yes || true
          sha256sum manaforge_cards.sqlite.gz | tee SHA256SUMS.txt
          gh release create card-db-latest manaforge_cards.sqlite.gz SHA256SUMS.txt \
            --title "Base de datos de cartas ($BULK_DATE)" \
            --notes "SQLite generada del bulk Default Cards de Scryfall ($BULK_DATE). La app la descarga en el primer arranque. Datos: Scryfall. Cartas: © Wizards of the Coast (Fan Content Policy)."
