name: Build app (Windows · macOS · Linux)
on:
  workflow_dispatch:
  push:
    tags: ['app-v*']
# Solo lectura por defecto: el permiso de escribir (publicar la release) lo
# tiene únicamente el job release. Así una acción de terceros comprometida en
# los builds no puede tocar el repo ni publicar nada.
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with: { channel: stable }
      - run: cd app && flutter create . --platforms=windows --project-name manaforge_app
      # el icono NO se genera solo: sin esto el .exe sale con el logo de Flutter
      - run: cd app && dart run flutter_launcher_icons
      - run: cd app && flutter build windows --release
      - run: Compress-Archive -Path app/build/windows/x64/runner/Release/* -DestinationPath ManaForge-Windows.zip
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with: { name: ManaForge-Windows, path: ManaForge-Windows.zip }
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with: { channel: stable }
      - run: cd app && flutter create . --platforms=macos --project-name manaforge_app
      - run: cd app && dart run flutter_launcher_icons
      - run: cd app && flutter build macos --release
      - run: cd app/build/macos/Build/Products/Release && zip -qry $GITHUB_WORKSPACE/ManaForge-macOS.zip *.app
      - uses: actions/upload-artifact@v4
        with: { name: ManaForge-macOS, path: ManaForge-macOS.zip }
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with: { channel: stable }
      - run: cd app && flutter create . --platforms=linux --project-name manaforge_app
      - run: cd app && flutter build linux --release
      # Linux no mete el icono en el binario: la app se enseña en el menú con
      # un .desktop y unos PNG. Van dentro del zip, y los instala instalar.sh
      - name: Meter icono, .desktop e instalador en el bundle
        run: |
          set -euo pipefail
          cp -r app/linux/packaging app/build/linux/x64/release/bundle/
          cp app/linux/packaging/instalar.sh app/build/linux/x64/release/bundle/
          chmod +x app/build/linux/x64/release/bundle/instalar.sh
          # la carpeta se llama "bundle" porque lo dice Flutter, no porque le
          # sirva a nadie: quien descomprime espera una carpeta con el nombre
          # de la app (y es lo que dicen el README y las notas de la release)
          mv app/build/linux/x64/release/bundle app/build/linux/x64/release/ManaForge
      - run: cd app/build/linux/x64/release && zip -qry $GITHUB_WORKSPACE/ManaForge-Linux.zip ManaForge
      - uses: actions/upload-artifact@v4
        with: { name: ManaForge-Linux, path: ManaForge-Linux.zip }
  release:
    needs: [windows, macos, linux]
    if: startsWith(github.ref, 'refs/tags/app-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { merge-multiple: true }
      - name: Huellas SHA-256 de los binarios
        # Los zips no van firmados: sin una huella publicada, nadie (ni tú)
        # puede comprobar que lo que se ha bajado es lo que salió de aquí.
        run: |
          set -euo pipefail
          sha256sum ManaForge-*.zip | tee SHA256SUMS.txt
      - name: Publicar release con los tres binarios
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo "Gratis, sin cuentas, sin anuncios. Descarga el zip de tu sistema, descomprime y abre."
            echo
            echo "| Sistema | Qué hacer |"
            echo "|---|---|"
            echo "| **Windows** | Abre \`manaforge.exe\`. La primera vez: *Más información → Ejecutar de todas formas* (no está firmado). |"
            echo "| **macOS** | La primera vez, **clic derecho sobre la app → Abrir**. Con doble clic macOS no deja abrir apps sin firmar. |"
            echo "| **Linux** | Descomprime y, dentro de la carpeta \`ManaForge\`, ejecuta \`./manaforge\`. Para tenerla en el menú de aplicaciones con su icono: \`./instalar.sh\` (todo en \`~/.local\`, sin sudo; se quita con \`./instalar.sh --desinstalar\`). |"
            echo
            echo "La primera vez la app se baja ~36 MB de datos (cartas, precios e huellas del escáner) enseñando el progreso. Después funciona sin conexión."
            echo
            echo "### Comprobar lo que has bajado"
            echo
            echo "Los binarios no van firmados, así que se publica su huella SHA-256 en \`SHA256SUMS.txt\`:"
            echo
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
            echo
            echo "Linux/macOS: \`sha256sum -c SHA256SUMS.txt\` (o \`shasum -a 256 -c\`) en la carpeta de descargas."
            echo "Windows: \`Get-FileHash ManaForge-Windows.zip\` y compara con la línea de arriba."
          } > notas.md
          gh release create "${GITHUB_REF_NAME}" ManaForge-*.zip SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "ManaForge ${GITHUB_REF_NAME#app-}" \
            --notes-file notas.md
