name: CI
on: [push, pull_request]
jobs:
  engine-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install pytest
      - run: cd engine-reference && python -m pytest tests/ -v
  forge-engine-dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: cd forge_engine && dart pub get
      - run: cd forge_engine && dart analyze --fatal-infos
      - run: cd forge_engine && dart test
