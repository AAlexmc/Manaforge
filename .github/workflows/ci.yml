name: CI
on: [push, pull_request]
jobs:
  engine-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      # ijson: el build del histórico de precios lee AllPrices.json en
      # streaming; sin él los tests caen a json.load y no se ejerce ese camino
      - run: pip install pytest pillow ijson
      - run: cd engine-reference && python -m pytest tests/ -v
      - run: cd scripts && python -m pytest tests/ -v
  forge-engine-dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: cd forge_engine && dart pub get
      - run: cd forge_engine && dart analyze
      - run: cd forge_engine && dart test
  app-flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: cd app && flutter pub get
      - run: cd app && flutter analyze --no-fatal-infos
      - run: cd app && flutter test
