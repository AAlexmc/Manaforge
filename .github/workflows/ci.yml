name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  engine-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      # ijson: el build del histórico de precios lee AllPrices.json en
      # streaming; sin él los tests caen a json.load y no se ejerce ese camino
      - run: pip install pytest pillow ijson
      - run: cd engine-reference && python -m pytest tests/ -v
      - run: cd scripts && python -m pytest tests/ -v
  forge-engine-dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: cd forge_engine && dart pub get
      - run: cd forge_engine && dart analyze
      - run: cd forge_engine && dart test
  app-flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
      - run: cd app && flutter pub get
      - run: cd app && flutter analyze --no-fatal-infos
      - run: cd app && flutter test
  # Solo COMPILA (sin tests: la suite tiene supuestos unix). Sin esto, el
  # primer fallo de compilación nativo de Windows/macOS aparecería con el tag
  # de release ya publicado — y bloquearía también el zip de Linux.
  build-desktop:
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
      - run: cd app && flutter pub get
      - run: cd app && flutter build windows --release
        if: runner.os == 'Windows'
      - run: cd app && flutter build macos --release
        if: runner.os == 'macOS'
